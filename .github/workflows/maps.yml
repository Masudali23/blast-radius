name: maps
# Rebuild the coverage maps inside the same image the scorer runs (manual).
on:
  workflow_dispatch:
jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --platform linux/amd64 --tag blast-radius-entry .
      - name: Trace, slice, calibrate
        run: |
          mkdir -p out
          docker run --rm --platform linux/amd64 --user 0:0 \
            --volume $PWD:/src:ro --volume $PWD/out:/out \
            --env PYTHONDONTWRITEBYTECODE=1 --env SKIP_INTEGRATION=0 \
            blast-radius-entry sh -c '
              set -e
              cp -r /src/tools /src/br /tmp/ && cd /tmp
              python tools/trace_all.py /app/repo /src/sample/tests.json /out/trace 4
              BR_INSTRUMENT=1 python tools/trace_all.py /app/repo /src/sample/tests.json /out/usage 4
              python tools/trace_slices_all.py /app/repo /src/sample/tests.json /out/slices 4 0.05
              python tools/trace_import.py /app/repo /out/import_trace.json
              python tools/calibrate.py /app/repo /src/sample/tests.json /out/calib.json /tmp/cal
              mkdir -p /out/maps
              python tools/build_maps.py /out/trace /src/sample/tests.json /out/import_trace.json /out/maps /out/slices /out/calib.json /out/usage
              python tools/build_reads.py /app/repo /out/maps
              python tools/trace_rel_all.py /app/repo /src/sample/tests.json /out/rel 4
              python tools/trace_rel_one.py /app/repo @import /out/rel_import.json
              python tools/build_relations.py /out/rel /src/sample/tests.json /app/repo /out/maps /out/rel_import.json
            '
      - uses: actions/upload-artifact@v4
        with:
          name: maps
          path: |
            out/maps
            out/calib.json
